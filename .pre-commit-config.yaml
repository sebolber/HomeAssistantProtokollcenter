repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Identisch zu requirements_dev.txt:ruff — sonst Drift zwischen
    # lokal (pre-commit) und CI (pip install).
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: mixed-line-ending
        args: [--fix=lf]
