# SonarCloud Automatic Analysis Konfiguration.
# Im Gegensatz zu sonar-project.properties (nur fuer CI-Scanner) liest
# SonarCloud Automatic Analysis ausschliesslich diese Datei. Nur die
# Scope-Properties unten werden respektiert — andere Sonar-Properties
# (z. B. python.version, issue.ignore.multicriteria) sind hier wirkungs-
# los und gehoeren ausschliesslich in sonar-project.properties fuer den
# CI-Scan-Pfad.

sonar.exclusions=\
  custom_components/messagehub/frontend_dist/**,\
  custom_components/messagehub/storage/sql/**,\
  frontend/dist/**,\
  frontend/node_modules/**,\
  frontend/src/**/*.js,\
  frontend/tests/**/*.js,\
  frontend/tsconfig.tsbuildinfo,\
  tests/fixtures/**,\
  **/__pycache__/**,\
  **/.mypy_cache/**,\
  **/.ruff_cache/**,\
  **/.pytest_cache/**,\
  .dev/**

sonar.coverage.exclusions=\
  tests/**,\
  tests/fixtures/**,\
  frontend/tests/**,\
  custom_components/messagehub/frontend_dist/**,\
  custom_components/messagehub/storage/sql/**
