# SonarCloud / SonarQube Konfiguration fuer das messagehub-Repo.
# Sonar laeuft sonst mit Defaults und scannt auch gebauten Frontend-Output,
# was zu hunderten Falsch-Findings (var-Statements, leere Lit-Lifecycle-
# Methoden, kleingeschriebene Konstruktoren) im Vite-Bundle fuehrt.

sonar.projectKey=sebolber_homeassistantprotokollcenter
sonar.organization=sebolber

# Source-Layout
sonar.sources=custom_components,frontend/src
sonar.tests=tests,frontend/tests
# Python-Versionen: Minimum 3.12 (siehe pyproject.toml: requires-python),
# CI testet zusaetzlich 3.13. Sonar prueft Kompatibilitaet mit beiden,
# damit z. B. ein 3.13-only-Feature in 3.12-Code nicht durchrutscht.
# Format mit Leerzeichen entspricht der SonarSource-Doku-Konvention.
sonar.python.version=3.12, 3.13
sonar.sourceEncoding=UTF-8


# Exclusions:
# - frontend_dist/: vom Vite committeter Build-Output (HACS-Pflicht), kein Review-Material
# - frontend/dist/: lokales Build-Verzeichnis falls genutzt
# - node_modules/: Drittcode
# - tsconfig.tsbuildinfo & .js neben .ts: tsc-Build-Nebenprodukte, gehoeren nicht in den Scan
# - alle Build- und Cache-Verzeichnisse
# - tests/fixtures/**: SQL-Finding-Fixtures (`*.sql`) sind statische
#   Test-Daten; "duplicate literal"-Treffer sind dort inhaerent (Spalten-
#   Werte ueber viele Zeilen wiederholt) und kein Code-Smell.
sonar.exclusions=\
  custom_components/messagehub/frontend_dist/**,\
  custom_components/messagehub/storage/sql/**,\
  frontend/dist/**,\
  frontend/node_modules/**,\
  frontend/src/**/*.js,\
  frontend/tests/**/*.js,\
  frontend/tsconfig.tsbuildinfo,\
  tests/fixtures/**,\
  **/__pycache__/**,\
  **/.mypy_cache/**,\
  **/.ruff_cache/**,\
  **/.pytest_cache/**,\
  .dev/**

# Coverage-Reports — auskommentiert weil der Sonar-Workflow keine
# Tests laeuft. Aktivieren sobald der CI-Workflow pytest --cov und
# vitest --coverage durchlaufen laesst und die Reports ablegt.
# sonar.python.coverage.reportPaths=coverage.xml
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=\
  tests/**,\
  tests/fixtures/**,\
  frontend/tests/**,\
  custom_components/messagehub/frontend_dist/**,\
  custom_components/messagehub/storage/sql/**

# Copy-Paste-Detection: generierte Dateien und Test-Setup duplizieren
# inhaerent — fuer den CPD-Index ausschliessen, sonst falsche
# Duplication-Quote.
sonar.cpd.exclusions=\
  frontend/src/utils/findings-i18n.generated.ts,\
  frontend/tests/**,\
  e2e/audit/**,\
  tests/**

# Regel-Ausnahmen pro Pfad.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
# e1/e2: hardcoded IPs in Tests sind gewollt — die Tests pruefen ja gerade,
# dass unsere Funktionen IPs aus Texten erkennen/extrahieren/filtern.
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**/*.py
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.e2.resourceKey=frontend/tests/**/*.ts
# e3: pytest-asyncio Tests sind `async def`, awaiten aber nur Repository/API-
# Aufrufe — Sonar erkennt das pytest-asyncio-Pattern nicht und meldet
# "async ohne await". False-Positive-Quelle.
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S7488
sonar.issue.ignore.multicriteria.e3.resourceKey=tests/**/*.py
# e4: dieselbe Regel hat unter Sonar verschiedene IDs je nach Sonar-Version;
# zweite gaengige Bezeichnung.
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S6822
sonar.issue.ignore.multicriteria.e4.resourceKey=tests/**/*.py
# e5: float-equality (S1244) — Tests assertieren deterministisch
# gespeicherte Werte (Confidence-Stamps, gerundete Stats), keine
# Float-Arithmetik. Exact-Equality ist hier inhaltlich richtig.
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S1244
sonar.issue.ignore.multicriteria.e5.resourceKey=tests/**/*.py
# e6: globalThis-statt-window (S7764) ist eine portability-Preference.
# Das messagehub-Panel ist eine reine browser-only Lit-Custom-Element-
# Komponente innerhalb des HA-Frontends — `window.location/history/
# setTimeout/confirm/...` ist semantisch klarer als `globalThis.X` und
# wird vom DOM-typed-API direkt aufgeloest. SSR-Guards (`typeof window
# !== "undefined"`) sind absichtlich, um Jest/jsdom-Test-Setups robust
# zu machen. Kein Cross-Env-Code in diesem Repo.
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S7764
sonar.issue.ignore.multicriteria.e6.resourceKey=frontend/src/**/*.ts
