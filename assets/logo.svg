<?xml version="1.0" encoding="UTF-8"?>
<!--
  Message Hub — Logo (Banner-Style fuer home-assistant/brands)
  256x256-Icon links + Wortmarke rechts.
  Render in 480x256 (logo.png) und 960x512 (logo@2x.png).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03a9f4"/>
      <stop offset="1" stop-color="#0277bd"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon-Tile links (256x256, gleiches Design wie icon.svg) -->
  <g transform="translate(0,0)">
    <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>
    <g filter="url(#ds)" transform="scale(0.5)">
      <path d="
        M 112 232 L 168 232 L 200 280 L 312 280 L 344 232 L 400 232
        L 400 384 Q 400 400 384 400 L 128 400 Q 112 400 112 384 Z"
        fill="#fff"/>
      <path d="
        M 112 232 L 168 168 L 344 168 L 400 232 L 344 232 L 312 280
        L 200 280 L 168 232 Z"
        fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="180" cy="112" r="22" fill="#ef5350"/>
      <circle cx="256" cy="92" r="22" fill="#ffb300"/>
      <circle cx="332" cy="112" r="22" fill="#66bb6a"/>
    </g>
    <g fill="#fff" opacity="0.55" transform="scale(0.5)">
      <circle cx="208" cy="160" r="4"/>
      <circle cx="220" cy="180" r="4"/>
      <circle cx="232" cy="200" r="4"/>
      <circle cx="256" cy="148" r="4"/>
      <circle cx="256" cy="172" r="4"/>
      <circle cx="256" cy="196" r="4"/>
      <circle cx="304" cy="160" r="4"/>
      <circle cx="292" cy="180" r="4"/>
      <circle cx="280" cy="200" r="4"/>
    </g>
    <g stroke="#03a9f4" stroke-width="6" stroke-linecap="round" opacity="0.55"
       transform="scale(0.5)">
      <line x1="160" y1="332" x2="352" y2="332"/>
      <line x1="172" y1="356" x2="340" y2="356"/>
      <line x1="184" y1="380" x2="328" y2="380"/>
    </g>
  </g>

  <!-- Wortmarke rechts -->
  <g transform="translate(284, 128)">
    <text x="0" y="0"
          font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="42"
          font-weight="700"
          fill="#1f2329"
          dominant-baseline="middle"
          letter-spacing="-1">Message</text>
    <text x="0" y="44"
          font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="42"
          font-weight="400"
          fill="#5f6470"
          dominant-baseline="middle"
          letter-spacing="-1">Hub</text>
  </g>
</svg>
