<?xml version="1.0" encoding="UTF-8"?>
<!--
  Message Hub — App-Icon
  Komposition:
    1. HA-Blau-Tile (abgerundetes Quadrat, Material-Design-Stil)
    2. Inbox-Symbol zentriert (Lucide-Inspiriert)
    3. Drei Severity-Punkte darueber (Error / Warning / Info)
  Optimiert fuer 256, 512, 1024 px Render.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03a9f4"/>
      <stop offset="1" stop-color="#0277bd"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hintergrund-Tile (Material-Style 22%-Radius) -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Inbox-Symbol (zentriert, weiss) -->
  <!-- Form: Trichter/Tray mit V-Einkerbung oben in der Mitte
       -> klar als "Eingang fuer Nachrichten" lesbar -->
  <g filter="url(#dropShadow)">
    <path d="
      M 112 232
      L 168 232
      L 200 280
      L 312 280
      L 344 232
      L 400 232
      L 400 384
      Q 400 400 384 400
      L 128 400
      Q 112 400 112 384
      Z"
      fill="#ffffff"/>
    <!-- Schraege Wand vom Tray (3D-Hint) -->
    <path d="
      M 112 232
      L 168 168
      L 344 168
      L 400 232
      Z"
      fill="#ffffff" opacity="0.22"/>
    <!-- Front-Trapezoid = der eigentliche Tray -->
    <path d="
      M 112 232
      L 168 168
      L 344 168
      L 400 232
      L 344 232
      L 312 280
      L 200 280
      L 168 232
      Z"
      fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Drei Severity-Dots ueber der Inbox -->
  <g filter="url(#dropShadow)">
    <!-- Error rot -->
    <circle cx="180" cy="112" r="22" fill="#ef5350"/>
    <!-- Warning amber -->
    <circle cx="256" cy="92" r="22" fill="#ffb300"/>
    <!-- Info gruen -->
    <circle cx="332" cy="112" r="22" fill="#66bb6a"/>
  </g>

  <!-- Subtile Punkt-Spuren (von Dots in den Trichter, "fliesst rein") -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="208" cy="160" r="4"/>
    <circle cx="220" cy="180" r="4"/>
    <circle cx="232" cy="200" r="4"/>
    <circle cx="256" cy="148" r="4"/>
    <circle cx="256" cy="172" r="4"/>
    <circle cx="256" cy="196" r="4"/>
    <circle cx="304" cy="160" r="4"/>
    <circle cx="292" cy="180" r="4"/>
    <circle cx="280" cy="200" r="4"/>
  </g>

  <!-- Inbox-Boden: 3 horizontale Stapel-Linien (Nachrichten drin) -->
  <g stroke="#03a9f4" stroke-width="6" stroke-linecap="round" opacity="0.55">
    <line x1="160" y1="332" x2="352" y2="332"/>
    <line x1="172" y1="356" x2="340" y2="356"/>
    <line x1="184" y1="380" x2="328" y2="380"/>
  </g>
</svg>
