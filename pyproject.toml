[project]
name = "messagehub"
version = "0.1.0"
description = "Home Assistant Custom Integration: zentrale Sammelstelle fuer Nachrichten und Fehlermeldungen"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "sebolber" }]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".dev",
    "frontend/dist",
    "frontend/node_modules",
    "custom_components/messagehub/frontend_dist",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                   # isort
    "N",                   # pep8-naming
    "UP",                  # pyupgrade
    "B",                   # flake8-bugbear
    "SIM",                 # flake8-simplify
    "ASYNC",               # flake8-async
    "RUF",                 # ruff-specific
    "C4",                  # comprehensions
    "PT",                  # pytest-style
    "PL",                  # pylint subset
    "TRY",                 # tryceratops
]
ignore = [
    "PLR0913",  # too many arguments — Konfigurations-Konstruktoren brauchen sie oft
    "TRY003",   # long messages in raise — wir wollen aussagekraeftige Fehler
]

[tool.ruff.lint.per-file-ignores]
# N802: Test-Funktionen referenzieren teils Pascal-Cased Klassen-Namen
# (z. B. test_..._GroupValueWrite) — das ist absichtlich, damit man im
# pytest-Output sofort sieht, welche xknx-Klasse getestet wird.
#
# Iter aiohttp-error-ZU9UA / Tech-Debt 2: Sammel-Cleanup. Ignorierungen
# fuer Tests, weil dort andere Prioritaeten gelten:
# - PT011: pytest.raises ohne `match=` ist akzeptabel, wenn die
#   geworfene Exception eindeutig aus dem zu testenden Code kommt.
# - PT006: parametrize mit String-Form ist lesbarer als Tuple.
# - PT018: kombinierte Assertions sind manchmal kompakter als zwei
#   einzelne (z. B. `len(x) == 1 and x[0].name == "foo"`).
# - PLC0415: lokale Imports innerhalb Test-Funktionen sind oft Absicht
#   (Lazy-Import um zirkulaere Imports zu vermeiden, Fixture-Scope).
"tests/**/*.py" = [
    "PLR2004",
    "S101",
    "PLR0915",
    "N802",
    "PT011",
    "PT006",
    "PT018",
    "PLC0415",
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
no_implicit_optional = true
files = ["custom_components/messagehub"]

[[tool.mypy.overrides]]
module = [
    "jsonpath_ng.*",
    "aiosqlite.*",
    "pytest_homeassistant_custom_component.*",
    "homeassistant.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: tests that take more than a second",
]

[tool.coverage.run]
source = ["custom_components/messagehub"]
branch = true
omit = ["custom_components/messagehub/frontend_dist/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
