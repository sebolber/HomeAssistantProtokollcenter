name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 ist out-of-scope: home-assistant-frontend ab 20250129 verlangt
        # Python>=3.13, und HA 2026.2.x pinnt genau dieses Constraint.
        # pyproject.toml:requires-python bleibt >=3.12 als pip-Untergrenze;
        # primary-Target ist 3.13 (DEVELOPMENT.md). Iter 02 prueft, ob
        # requires-python noch enger gezogen werden sollte.
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy custom_components/messagehub

      - name: pytest with coverage
        # Threshold spiegelt den tatsaechlich unit-testbaren Anteil. Die
        # API-Endpoint-Module (custom_components/messagehub/api/*) liegen
        # bei 15-25%, weil sie aiohttp-Views innerhalb der HA-Runtime
        # sind — eigentliches End-to-End geht nur mit einer laufenden
        # HA-Instance (siehe DEVELOPMENT.md), nicht im pytest-unit-Lauf.
        # 70% ist die aktuelle Realitaet plus ~1 pp Buffer; die naechste
        # Stufe (75%, 80%) braucht echte HA-Integration-Tests, kein
        # Mocking.
        run: pytest --cov=custom_components/messagehub --cov-report=term-missing --cov-fail-under=70

  frontend:
    name: Frontend (typecheck + tests + bundle-consistency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Typecheck
        run: npm run typecheck --prefix frontend

      - name: Vitest
        run: npm test --prefix frontend -- --run

      # Iter F4: Bundle-CI-Konsistenz. HACS hat keinen Build-Step, das
      # Bundle wird committet. Hier verifizieren wir, dass der committet
      # Stand dem aktuellen Source entspricht — sonst laeuft der User
      # mit veralteter Frontend-Logik gegen neuen Backend-Code.
      - name: Build bundle
        run: npm run build --prefix frontend

      - name: Verify committed bundle matches source
        run: |
          if ! git diff --quiet -- custom_components/messagehub/frontend_dist/; then
            echo "::error::Frontend-Bundle ist nicht aktuell. Bitte 'npm run build --prefix frontend' lokal ausfuehren und das Bundle committen."
            git --no-pager diff --stat -- custom_components/messagehub/frontend_dist/
            exit 1
          fi
          echo "Bundle ist konsistent mit dem Source-Stand."
